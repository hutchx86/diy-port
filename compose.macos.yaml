# macOS container (NAT + pf): see docker/README.md#macos-orbstack--docker-desktop.

name: piport-macos

services:
  aiport:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ACCEL: cpu
    image: piport-cpu
    container_name: piport-macos
    # The wrapper keeps a stable identity and config in /data (docker/entrypoint.py).
    entrypoint: ["python3", "docker/entrypoint.py"]
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    environment:
      AIPORT_CONSOLE: "${AIPORT_CONSOLE:?the Protect console's IP, e.g. 192.0.2.1}"
      AIPORT_ADVERTISE_IP: "${AIPORT_ADVERTISE_IP:?the Mac's alias address}"
      AIPORT_HOSTNAME: "${AIPORT_HOSTNAME:-piport-docker}"
      AIPORT_DEBUG: "${AIPORT_DEBUG:-}"
    ports:
      - "${AIPORT_ADVERTISE_IP}:${AIPORT_PUBLISH_PORT:-18443}:443"
    volumes:
      - piport-macos-data:/data

volumes:
  piport-macos-data:
