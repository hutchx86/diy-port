name: CI
on: [push, pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x scripts/*.sh docker/run-smoke-test.sh
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r diyport/requirements.txt
      - name: Install OpenVINO (its backend tests run on OpenVINO's CPU plugin)
        run: pip install openvino
      - name: Unit tests
        run: cd diyport && python3 -m unittest discover -s tests -v

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-restreamer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-restreamer/go.mod
          cache-dependency-path: go-restreamer/go.sum
      - name: Install ffmpeg (audio and transcode tests use it; they skip without it)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet and test (race)
        run: make test
      - name: Build (linux arm64)
        run: make linux-arm64

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image (amd64)
        run: docker build -f docker/Dockerfile -t diyport-cpu .
      - name: No-hardware smoke test
        env:
          SKIP_BUILD: "1"
          WAIT: "20"
        run: ./docker/run-smoke-test.sh
